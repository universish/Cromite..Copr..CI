name: Çoklu Dağıtım (Fedora & openSUSE) RPM Paketleme CI

on:
  push:
    branches: [main]
    paths:
      - 'cromite.spec'
      - 'cromite.desktop'
      - 'cromite.sh'
      - 'org.cromite.cromite.metainfo.xml'
      - '.copr/Makefile'
      - '.github/workflows/build-rpm.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fedora:
    name: Fedora (${{ matrix.release }}) x86_64 RPM
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        # Fedora 44, 45 (veya aktif geliştirme dalı) ve Rawhide
        release: ['44', 'rawhide']
    steps:
      - name: Fedora RPM Derleme Araçlarını Kur
        run: |
          dnf -y install \
            rpm-build \
            rpmdevtools \
            dnf-plugins-core \
            desktop-file-utils \
            libappstream-glib \
            git \
            curl \
            jq \
            tar \
            gzip \
            awk

      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Kaynak Tarball (chrome-lin64.tar.gz) İndir ve RPM Derle
        id: build
        run: |
          rpmdev-setuptree
          cp -f cromite.desktop cromite.sh org.cromite.cromite.metainfo.xml ~/rpmbuild/SOURCES/
          SOURCE_URL="$(rpmspec -P cromite.spec | awk '/^Source0:/ {print $2}')"
          echo "İndiriliyor: ${SOURCE_URL}"
          curl -fL --retry 3 -o ~/rpmbuild/SOURCES/chrome-lin64.tar.gz "${SOURCE_URL}"
          rpmbuild -ba cromite.spec
          mkdir -p dist
          cp -v ~/rpmbuild/SRPMS/*.src.rpm dist/
          cp -v ~/rpmbuild/RPMS/x86_64/*.rpm dist/
          VERSION="$(rpmspec -q --qf '%{version}
' cromite.spec | head -n1)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Fedora ${{ matrix.release }} RPM Paketlerini Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cromite-fedora-${{ matrix.release }}-x86_64-${{ steps.build.outputs.version }}
          path: dist/*.rpm

      - name: GitHub Release Yayınla
        if: matrix.release == 'rawhide' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}-rpm
          name: Cromite RPM v${{ steps.build.outputs.version }}
          body: |
            [uazo/cromite](https://github.com/uazo/cromite/releases) `chrome-lin64.tar.gz` arşivinden otomatik oluşturulan RPM paketleri.
            - **Fedora COPR Deposu:** https://copr.fedorainfracloud.org/coprs/universish/Cromite../
            - **Desteklenen Dağıtımlar:** Fedora 44, Fedora 45, Fedora Rawhide, openSUSE Tumbleweed, openSUSE Leap 16.0
          files: |
            dist/*.rpm
          generate_release_notes: true

  build-opensuse:
    name: openSUSE (${{ matrix.distro_name }}) x86_64 RPM
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_name: 'Tumbleweed'
            image: 'registry.opensuse.org/opensuse/tumbleweed:latest'
          - distro_name: 'Leap-16.0'
            image: 'registry.opensuse.org/opensuse/leap:16.0'
    steps:
      - name: openSUSE RPM Derleme Araçlarını Kur
        run: |
          zypper --non-interactive install \
            rpm-build \
            desktop-file-utils \
            appstream-glib \
            git-core \
            curl \
            jq \
            tar \
            gzip \
            gawk

      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Kaynak Tarball (chrome-lin64.tar.gz) İndir ve openSUSE RPM Derle
        id: build
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp -f cromite.desktop cromite.sh org.cromite.cromite.metainfo.xml /tmp/rpmbuild/SOURCES/
          SOURCE_URL="$(rpmspec -P cromite.spec | awk '/^Source0:/ {print $2}')"
          echo "İndiriliyor: ${SOURCE_URL}"
          curl -fL --retry 3 -o /tmp/rpmbuild/SOURCES/chrome-lin64.tar.gz "${SOURCE_URL}"
          rpmbuild -ba \
            --define "_topdir /tmp/rpmbuild" \
            --define "_sourcedir /tmp/rpmbuild/SOURCES" \
            cromite.spec
          mkdir -p dist
          cp -v /tmp/rpmbuild/RPMS/x86_64/*.rpm dist/
          VERSION="$(rpmspec -q --qf '%{version}
' cromite.spec | head -n1)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: openSUSE ${{ matrix.distro_name }} RPM Paketlerini Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cromite-opensuse-${{ matrix.distro_name }}-x86_64-${{ steps.build.outputs.version }}
          path: dist/*.rpm
