name: Cromite Upstream Kontrol, RPM Paketleme ve Fedora COPR Yayınlama CI

on:
  schedule:
    # uazo'nun yerel saat dilimi (İtalya - Europe/Rome):
    # Öğle arası (~12:30 CEST / 11:30 CET) ve İş çıkışı (~18:30 CEST / 17:30 CET)
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Yeni sürüm olmasa bile zorla paketle ve COPR deposuna gönder'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. AŞAMA: GÜNCEL SÜRÜMÜN YAYINLANIP YAYINLANMADIĞININ KONTROLÜ
  # ============================================================================
  stage-1-check-update:
    name: "1. Aşama: Upstream Sürüm Kontrolü"
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      short_commit: ${{ steps.check.outputs.short_commit }}
      tag: ${{ steps.check.outputs.tag }}
      asset_url: ${{ steps.check.outputs.asset_url }}
      asset_digest: ${{ steps.check.outputs.asset_digest }}
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: uazo/cromite Yeni Sürüm Kontrolü
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh
          
          # Zorla paketleme seçildiyse scriptin engelini aşıp güncellemeyi onaylıyoruz
          if [[ "${{ inputs.force_build }}" == "true" ]]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Kontrol Sonucu Özeti
        run: |
          if [[ "${{ steps.check.outputs.updated }}" == "true" ]]; then
            echo "🚀 Yeni sürüm doğrulandı veya 'Zorla Paketleme' seçildi. 2. aşamaya geçiliyor..."
          else
            echo "⏹️ Yeni güncelleme yayınlanmadı ve zorla paketleme seçilmedi (Mevcut: v${{ steps.check.outputs.version }}). İş akışı sonlandırılıyor."
          fi

  # ============================================================================
  # 2. AŞAMA: GITHUB ACTIONS ÜZERİNDE İNDİRME, VİRÜS TARAMASI VE RPM PAKETLEME
  # ============================================================================
  stage-2-repackage-rpm:
    name: "2. Aşama: GitHub Actions Virüs Taraması ve RPM Paketleme"
    needs: stage-1-check-update
    if: needs.stage-1-check-update.outputs.updated == 'true'
    runs-on: ubuntu-latest
    container:
      # Bu Fedora konteyneri GitHub Actions sanal makinesinde çalışır.
      image: registry.fedoraproject.org/fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Fedora RPM ve Güvenlik Araçlarını Kur
        run: |
          dnf -y install \
          rpm-build \
          rpmdevtools \
          dnf-plugins-core \
          desktop-file-utils \
          libappstream-glib \
          git \
          curl \
          jq \
          tar \
          gzip \
          awk \
          sed \
          binutils \
          python3 \
          clamav \
          clamav-data \
          clamav-update

      - name: Depoyu İndir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tarama Kapısının Hata Senaryolarını Doğrula
        run: python3 -B -m unittest discover -s tests -v

      - name: Spec Güncelleme ve Upstream Arşivini İndirme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          UPSTREAM_TAG: ${{ needs.stage-1-check-update.outputs.tag }}
        run: |
          # 1. Spec dosyasını güncel sürümle ayarla
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh

          # 2. RPM Ağacını oluştur ve dosyaları kopyala
          rpmdev-setuptree
          cp -f assets/cromite-icon.png ~/rpmbuild/SOURCES/ || echo "UYARI: İkon kopyalanamadı"
          cp -f *.desktop *.sh *.xml ~/rpmbuild/SOURCES/ 2>/dev/null || :

          # 3. Kaynak Arşivi İndir
          echo "📥 İndiriliyor: ${{ needs.stage-1-check-update.outputs.asset_url }}"
          curl -fL --retry 3 -o ~/rpmbuild/SOURCES/chrome-lin64.tar.gz "${{ needs.stage-1-check-update.outputs.asset_url }}"

      - name: GitHub Actions Üzerinde ClamAV Veritabanını Güncelle
        run: |
          sed -i 's/^Example/#Example/g' /etc/freshclam.conf
          freshclam --stdout

      - name: GitHub Actions Üzerinde Zorunlu Virüs Taraması
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          EXPECTED_SHA256: ${{ needs.stage-1-check-update.outputs.asset_digest }}
        run: bash scripts/scan_archive.sh "$HOME/rpmbuild/SOURCES/chrome-lin64.tar.gz" dist/security-report.json

      - name: Taranmış Arşivden RPM ve SRPM Oluştur
        run: |
          SPEC_FILE="Cromite.spec"
          [ ! -f "$SPEC_FILE" ] && SPEC_FILE="cromite.spec"

          # Her upstream sürümünün gerçek ELF gereksinimini SRPM'e yaz.
          MIN_GLIBC=$(jq -er '.min_glibc | select(test("^[0-9]+(\\.[0-9]+)+$"))' dist/security-report.json)
          sed -i "s/^%global _min_glibc .*/%global _min_glibc $MIN_GLIBC/" "$SPEC_FILE"

          echo "📦 Fedora COPR Spec ile RPM derleniyor..."
          # Spec dosyasındaki tüm bağımlılıkları otomatik olarak kurar
          dnf builddep -y "$SPEC_FILE"
          # RPM DERLEME
          rpmbuild -ba "$SPEC_FILE"

          mkdir -p dist
          cp -v ~/rpmbuild/SRPMS/*.src.rpm dist/
          cp -v ~/rpmbuild/RPMS/x86_64/*.rpm dist/

      - name: Güncellenen Spec Dosyasını Depoya Commit Et
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update Cromite to v${{ needs.stage-1-check-update.outputs.version }} (${{ needs.stage-1-check-update.outputs.short_commit }})"
            git push origin HEAD:main
          fi

      - name: Derlenen RPM ve SRPM Paketlerini Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cromite-rpms-${{ needs.stage-1-check-update.outputs.version }}
          path: |
            dist/*.rpm
            dist/security-report.json

  # ============================================================================
  # 3. AŞAMA: FEDORA COPR DEPOSUNA GÖNDERİM VE YAYINLAMA
  # ============================================================================
  stage-3-publish-copr:
    name: "3. Aşama: Fedora COPR Yayınlama ve Bildirim"
    needs: [stage-1-check-update, stage-2-repackage-rpm]
    if: always() && needs.stage-1-check-update.outputs.updated == 'true' && needs.stage-2-repackage-rpm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: RPM Paketlerini İndir
        uses: actions/download-artifact@v4
        with:
          name: cromite-rpms-${{ needs.stage-1-check-update.outputs.version }}
          path: dist

      - name: COPR CLI Kurulumu
        run: pipx install copr-cli

      - name: COPR Kimlik Doğrulama Ayarı
        run: |
          mkdir -p ~/.config
          cat <<EOF > ~/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Fedora COPR Üzerinde Derlemeyi Başlat (Doğrudan Yükleme)
        run: |
          # Yalnızca GitHub Actions'taki zorunlu taramadan geçen SRPM gönderilir.
          # COPR spec dosyasında virüs taraması çalıştırılmaz.
          # --chroot ile sınırlama yok: projedeki tüm etkin chroot'lar derlenir.
          copr-cli build universish/Cromite.. dist/*.src.rpm

      - name: Bildirim Gönderimi (Opsiyonel)
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          chmod +x scripts/send_webhook.sh
          # COPR tetiklemesini sildiğimiz için bu script artık sadece Discord/Telegram vb. bildirimler için kullanılabilir.
          ./scripts/send_webhook.sh \
            "${{ needs.stage-1-check-update.outputs.version }}" \
            "${{ needs.stage-1-check-update.outputs.commit }}"

      - name: GitHub Releases Üzerinde RPM Paketlerini Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.stage-1-check-update.outputs.version }}-${{ needs.stage-1-check-update.outputs.short_commit }}
          name: Cromite RPM v${{ needs.stage-1-check-update.outputs.version }} (${{ needs.stage-1-check-update.outputs.short_commit }})
          body: |
            [uazo/cromite](https://github.com/uazo/cromite/releases/tag/${{ needs.stage-1-check-update.outputs.tag }}) `chrome-lin64.tar.gz` sürümünden otomatik olarak paketlenen RPM ve SRPM dosyaları.
            - **Fedora COPR Deposu:** https://copr.fedorainfracloud.org/coprs/universish/Cromite../
          files: |
            dist/*.rpm
          generate_release_notes: true
