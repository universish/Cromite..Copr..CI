name: Cromite Upstream Kontrol, RPM Paketleme ve Fedora COPR Yayınlama CI

on:
  schedule:
    # uazo'nun yerel saat dilimi (İtalya - Europe/Rome):
    # Öğle arası (~12:30 CEST / 11:30 CET) ve İş çıkışı (~18:30 CEST / 17:30 CET)
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Yeni sürüm olmasa bile zorla paketle ve COPR deposuna gönder'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. AŞAMA: GÜNCEL SÜRÜMÜN YAYINLANIP YAYINLANMADIĞININ KONTROLÜ
  # ============================================================================
  stage-1-check-update:
    name: "1. Aşama: Upstream Sürüm Kontrolü"
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      short_commit: ${{ steps.check.outputs.short_commit }}
      tag: ${{ steps.check.outputs.tag }}
      asset_url: ${{ steps.check.outputs.asset_url }}
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: uazo/cromite Yeni Sürüm Kontrolü
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh

      - name: Kontrol Sonucu Özeti
        run: |
          if [[ "${{ steps.check.outputs.updated }}" == "true" ]]; then
            echo "🚀 Yeni sürüm doğrulandı: v${{ steps.check.outputs.version }} (${{ steps.check.outputs.short_commit }}). 2. aşamaya geçiliyor..."
          else
            echo "⏹️ Yeni güncelleme yayınlanmadı (Mevcut: v${{ steps.check.outputs.version }}). İş akışı sonlandırılıyor."
          fi

  # ============================================================================
  # 2. AŞAMA: ARŞİVİN İNDİRİLİP AÇILMASI VE RPM SPEC İLE YENİDEN PAKETLENMESİ
  # ============================================================================
  stage-2-repackage-rpm:
    name: "2. Aşama: İndirme ve RPM Paketleme"
    needs: stage-1-check-update
    if: needs.stage-1-check-update.outputs.updated == 'true'
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Fedora RPM ve Güvenlik Araçlarını Kur
        run: |
          dnf -y install \
            rpm-build \
            rpmdevtools \
            dnf-plugins-core \
            desktop-file-utils \
            libappstream-glib \
            git \
            curl \
            jq \
            tar \
            gzip \
            awk \
            sed \
            clamav \
            clamav-data

      - name: Spec Dosyasını Güncelle, Arşivi İndir ve Güvenlik Taraması Yap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          # Spec dosyasını yeni sürüm bilgileriyle güncelle
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh

          SPEC_FILE="Cromite.spec"
          [ ! -f "$SPEC_FILE" ] && SPEC_FILE="cromite.spec"

          rpmdev-setuptree
          
          # İkonu ve gerekli dosyaları SOURCES dizinine kopyala
          mkdir -p ~/rpmbuild/SOURCES/
          cp -f assets/cromite-icon.png ~/rpmbuild/SOURCES/
          cp -f *.desktop *.sh *.xml ~/rpmbuild/SOURCES/ 2>/dev/null || :

          echo "📥 İndiriliyor: ${{ needs.stage-1-check-update.outputs.asset_url }}"
          curl -fL --retry 3 -o ~/rpmbuild/SOURCES/chrome-lin64.tar.gz "${{ needs.stage-1-check-update.outputs.asset_url }}"

          # ====================================================================
          # TEDARİK ZİNCİRİ GÜVENLİK KONTROLÜ (VirusTotal + ClamAV)
          # ====================================================================
          echo "🔒 Tedarik zinciri güvenliği taramaları başlatılıyor..."

          # 1. Aşama: VirusTotal API Hash Sorgusu
          if [ -z "${VT_API_KEY:-}" ]; then
              echo "⚠️ UYARI: VT_API_KEY bulunamadı. VirusTotal adımı atlanıyor!"
          else
              echo "🔍 VirusTotal'de dosya özeti (hash) sorgulanıyor..."
              TAR_HASH=$(sha256sum ~/rpmbuild/SOURCES/chrome-lin64.tar.gz | awk '{print $1}')
              
              VT_RESPONSE=$(curl -s -w "\n%{http_code}" --request GET \
                --url "https://www.virustotal.com/api/v3/files/$TAR_HASH" \
                --header "x-apikey: ${VT_API_KEY}")
                
              HTTP_CODE=$(echo "$VT_RESPONSE" | tail -n1)
              JSON_BODY=$(echo "$VT_RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" -eq 200 ]; then
                  MALICIOUS=$(echo "$JSON_BODY" | jq -r '.data.attributes.last_analysis_stats.malicious')
                  if [ "$MALICIOUS" -gt 0 ]; then
                      echo "❌ KRİTİK HATA: VirusTotal bu dosyada $MALICIOUS adet zararlı tespiti buldu! Derleme iptal ediliyor."
                      exit 1
                  else
                      echo "✅ VirusTotal Taraması Temiz: 0 zararlı."
                  fi
              elif [ "$HTTP_CODE" -eq 404 ]; then
                  echo "ℹ️ BİLGİ: Dosya henüz VirusTotal'de yok (Yeni sürüm). ClamAV ile devam ediliyor."
              else
                  echo "⚠️ UYARI: VirusTotal API yanıt vermedi (HTTP $HTTP_CODE)."
              fi
          fi

          # 2. Aşama: ClamAV ile Yerel Arşiv ve Dosya Taraması
          echo "🦠 ClamAV ile arşiv taranıyor..."
          freshclam --quiet || true
          mkdir -p /tmp/verify-extract
          tar -xzf ~/rpmbuild/SOURCES/chrome-lin64.tar.gz -C /tmp/verify-extract
          
          clamscan --recursive --infected --failifmacs /tmp/verify-extract || { 
              echo "❌ KRİTİK HATA: ClamAV zararlı yazılım tespit etti! Derleme iptal ediliyor."; 
              exit 1; 
          }
          rm -rf /tmp/verify-extract
          echo "✅ ClamAV taraması temiz."

          # ====================================================================
          # RPM PAKETLEME
          # ====================================================================
          echo "📦 Fedora COPR Spec ile SRPM ve RPM paketleniyor..."
          rpmbuild -ba "$SPEC_FILE"

          mkdir -p dist
          cp -v ~/rpmbuild/SRPMS/*.src.rpm dist/
          cp -v ~/rpmbuild/RPMS/x86_64/*.rpm dist/

      - name: Güncellenen Spec Dosyasını Depoya Commit Et
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update Cromite to v${{ needs.stage-1-check-update.outputs.version }} (${{ needs.stage-1-check-update.outputs.short_commit }})"
            git push origin HEAD:main
          fi

      - name: Derlenen RPM ve SRPM Paketlerini Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cromite-rpms-${{ needs.stage-1-check-update.outputs.version }}
          path: dist/*.rpm
          
  # ============================================================================
  # 3. AŞAMA: FEDORA COPR DEPOSUNA GÖNDERİM VE YAYINLAMA
  # ============================================================================
  stage-3-publish-copr:
    name: "3. Aşama: Fedora COPR Yayınlama ve Bildirim"
    needs: [stage-1-check-update, stage-2-repackage-rpm]
    if: always() && needs.stage-1-check-update.outputs.updated == 'true' && needs.stage-2-repackage-rpm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: RPM Paketlerini İndir
        uses: actions/download-artifact@v4
        with:
          name: cromite-rpms-${{ needs.stage-1-check-update.outputs.version }}
          path: dist

      - name: Fedora COPR Deposunu Tetikle ve Yayınla
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          chmod +x scripts/send_webhook.sh
          ./scripts/send_webhook.sh \
            "${{ needs.stage-1-check-update.outputs.version }}" \
            "${{ needs.stage-1-check-update.outputs.commit }}"

      - name: GitHub Releases Üzerinde RPM Paketlerini Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.stage-1-check-update.outputs.version }}-${{ needs.stage-1-check-update.outputs.short_commit }}
          name: Cromite RPM v${{ needs.stage-1-check-update.outputs.version }} (${{ needs.stage-1-check-update.outputs.short_commit }})
          body: |
            [uazo/cromite](https://github.com/uazo/cromite/releases/tag/${{ needs.stage-1-check-update.outputs.tag }}) `chrome-lin64.tar.gz` sürümünden otomatik olarak paketlenen RPM ve SRPM dosyaları.
            - **Fedora COPR Deposu:** https://copr.fedorainfracloud.org/coprs/universish/Cromite../
          files: |
            dist/*.rpm
          generate_release_notes: true
